<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Masuk — SEMESTA 2026</title>
<meta name="description" content="Halaman masuk akun Program SEMESTA 2026, Direktorat Sekolah Menengah Atas, Kementerian Pendidikan Dasar dan Menengah Republik Indonesia.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
  :root{
    --navy-deep:#013BA7;
    --navy:#013BA7;
    --blue:#1366C2;
    --cyan:#38A0DF;
    --white:#ffffff;
    --ink:#0b1730;
    --paper:#f5f8fd;
    --line:#e1e8f5;
    --amber:#FDC202;
    --green:#28b876;
    --red:#e5484d;
    --muted:#5b6a8a;
    --radius:20px;
    --shadow:0 20px 50px -25px rgba(7,27,63,.35);
    --maxw:1180px;
    --header-h:69px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink);background:var(--navy-deep);-webkit-font-smoothing:antialiased;overflow-x:hidden;display:flex;flex-direction:column;min-height:100dvh}
  h1,h2,h3,h4{font-family:'Plus Jakarta Sans',sans-serif;margin:0;color:var(--ink);letter-spacing:-0.01em}
  p{margin:0}
  a{text-decoration:none;color:inherit}
  ul{margin:0;padding:0;list-style:none}
  button{font-family:inherit;cursor:pointer;border:none;background:none}
  img{max-width:100%;display:block}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 28px;width:100%}
  section{position:relative}

  .eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;letter-spacing:.04em;color:var(--blue);background:rgba(19,102,194,.08);padding:7px 14px;border-radius:100px;margin-bottom:16px}
  .eyebrow.on-dark{color:#bcd4ff;background:rgba(255,255,255,.08)}
  .eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--cyan)}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:15px 28px;border-radius:100px;font-weight:600;font-size:15px;transition:transform .25s ease, box-shadow .25s ease, background .25s ease;white-space:nowrap}
  .btn-primary{background:var(--amber);color:#231400;box-shadow:0 14px 30px -12px rgba(253,194,2,.65)}
  .btn-primary:hover{transform:translateY(-2px);box-shadow:0 18px 36px -12px rgba(253,194,2,.8)}
  .btn-primary:disabled{opacity:.65;cursor:wait;transform:none}

  header#navbar{position:sticky;top:0;left:0;right:0;z-index:100;padding:14px 0;background:#fff;box-shadow:0 8px 24px -18px rgba(7,27,63,.25);flex-shrink:0}
  header#navbar .wrap{display:flex;align-items:center;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:12px}
  .brand-logo-img{height:40px;width:auto;display:block}
  .back-link{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;color:var(--ink);padding:10px 16px;border-radius:100px;transition:background .2s ease}
  .back-link:hover{background:rgba(7,27,63,.06)}
  .back-link svg{width:15px;height:15px}

  /* ============ LOGIN (full navy) ============ */
  #login-page{flex:1;background:radial-gradient(circle at 15% 0%, #1366C2 0%, var(--navy-deep) 45%, var(--navy-deep) 100%);color:#fff;display:flex;align-items:center;justify-content:center;padding:36px 20px}
  .login-wrap{display:flex;flex-direction:column;align-items:center;text-align:center;gap:26px;max-width:480px;margin:0 auto;padding:0;width:100%}
  .login-intro h1{font-size:clamp(24px,4.5vw,30px);line-height:1.15;color:#fff;font-weight:700}
  .login-intro .tagline{margin-top:10px;font-size:14.5px;font-weight:600;color:var(--amber)}

  .form-card{width:100%;background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:28px 24px;text-align:left}
  @media (min-width:480px){ .form-card{padding:36px 40px} }

  fieldset{border:0;padding:0;margin:0}
  label{display:block;font-size:13.5px;font-weight:600;color:var(--ink);margin-bottom:7px}
  input{width:100%;padding:13px 16px;font-family:inherit;font-size:14.5px;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:12px;outline:none;transition:border-color .2s ease, background .2s ease, box-shadow .2s ease}
  input:focus{border-color:var(--blue);background:#fff;box-shadow:0 0 0 4px rgba(19,102,194,.1)}
  input::placeholder{color:#9aa8c4}

  .field-grid{display:grid;grid-template-columns:1fr;gap:16px}

  .field-error{display:none;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:#b91c1c;background:#fef2f2;border:1px solid #fecaca;padding:9px 12px;border-radius:9px;margin-top:8px}
  .field-error.show{display:flex}
  .field-error svg{width:14px;height:14px;flex-shrink:0}

  .pw-field{position:relative}
  .pw-toggle{position:absolute;right:6px;top:32px;width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
  .pw-toggle:hover{background:rgba(7,27,63,.06);color:var(--ink)}
  .pw-toggle svg{width:17px;height:17px}

  .forgot-link{display:block;text-align:right;font-size:12.5px;font-weight:600;color:var(--blue);margin-top:8px}
  .forgot-link:hover{text-decoration:underline}
  .actions-row{margin-top:22px}
  .actions-row .btn{width:100%}
  .actions-row .btn svg{width:17px;height:17px}
  .submit-note{text-align:center;font-size:13px;color:var(--muted);margin-top:18px}
  .submit-note a{color:var(--blue);font-weight:600}
  .submit-note a:hover{text-decoration:underline}

  footer{background:var(--navy-deep);color:#8ea1cc;padding:20px 0;flex-shrink:0;text-align:center}
  .foot-min{font-size:12px}

  .spin{animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  @media (max-width:640px){
    .wrap{padding:0 20px}
    #login-page{padding:28px 16px}
  }
</style>
</head>

          <button type="submit" id="btnLogin" class="btn btn-primary">
            <i data-lucide="log-in"></i> Masuk
          </button>
        </div>

        <p class="field-error" id="loginError" style="justify-content:center;margin-top:16px"><i data-lucide="alert-circle"></i> <span id="loginErrorMsg"></span></p>
        <p class="submit-note">Belum punya akun? <a href="daftar.html">Daftar di sini</a></p>
      </form>
    </div>
  </div>
</section>

<footer>
  <div class="wrap">
    <div class="foot-min">© 2026 Direktorat Sekolah Menengah Atas — Kementerian Pendidikan Dasar dan Menengah Republik Indonesia</div>
  </div>
</footer>

<script>
  lucide.createIcons();

  const SUPABASE_URL = 'https://gpjdmdrnvpuokptmkvqn.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdwamRtZHJudnB1b2twdG1rdnFuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwOTg4NDYsImV4cCI6MjEwNDY3NDg0Nn0.Bs-MZPXfQ0xNfSfbdtq84XbwzdeSOUxlNvUSxAEaii4';
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  async function routeByRole(userId) {
    const { data: roleData, error: roleError } = await supabaseClient
      .from('user_roles')
      .select('role')
      .eq('id', userId)
      .single();

    if (roleError) {
      showLoginError('Login berhasil, tapi gagal membaca role akun: ' + roleError.message);
      return;
    }

    if (roleData.role === 'admin') { window.location.href = 'admin.html'; return; }
    if (roleData.role === 'kurator') { window.location.href = 'kurasi.html'; return; }
    window.location.href = 'beranda.html';
  }

  (async () => {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session) {
      routeByRole(session.user.id);
    }
  })();

  document.querySelectorAll('.pw-toggle').forEach(btn => {
    btn.addEventListener('click', () => {
      const input = document.getElementById(btn.dataset.target);
      const isHidden = input.type === 'password';
      input.type = isHidden ? 'text' : 'password';
      btn.innerHTML = isHidden ? '<i data-lucide="eye-off"></i>' : '<i data-lucide="eye"></i>';
      lucide.createIcons();
    });
  });

  const form = document.getElementById('formLogin');
  const btnLogin = document.getElementById('btnLogin');
  const emailInput = document.getElementById('email');
  const pwInput = document.getElementById('password');
  const loginError = document.getElementById('loginError');
  const loginErrorMsg = document.getElementById('loginErrorMsg');

  function showLoginError(msg) {
    loginErrorMsg.textContent = msg;
    loginError.classList.add('show');
  }

  form.addEventListener('submit', async function (e) {
    e.preventDefault();

    if (!emailInput.checkValidity() || !pwInput.checkValidity()) {
      form.reportValidity();
      return;
    }

    loginError.classList.remove('show');
    const originalText = btnLogin.innerHTML;
    btnLogin.innerHTML = '<i data-lucide="loader-circle" class="spin"></i> Memproses...';
    btnLogin.disabled = true;
    lucide.createIcons();

    try {
      const { data, error } = await supabaseClient.auth.signInWithPassword({
        email: emailInput.value.trim(),
        password: pwInput.value
      });

      if (error) {
        throw new Error(
          error.message.includes('Invalid login credentials')
            ? 'Email atau kata sandi salah.'
            : error.message.includes('Email not confirmed')
              ? 'Email Anda belum dikonfirmasi. Silakan cek inbox Anda.'
              : error.message
        );
      }

      await routeByRole(data.user.id);

    } catch (err) {
      showLoginError(err.message || 'Terjadi kesalahan. Silakan coba lagi.');
      btnLogin.innerHTML = originalText;
      btnLogin.disabled = false;
      lucide.createIcons();
    }
  });
</script>
</body>
</html>
