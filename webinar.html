<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Webinar — LMS SEMESTA 2026</title>
<meta name="description" content="LMS Program SEMESTA 2026, Direktorat Sekolah Menengah Atas, Kementerian Pendidikan Dasar dan Menengah Republik Indonesia.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  /* Cegah select & copy teks soal pretest/posttest — surgical, cuma di area .quiz-question */
  .quiz-question, .quiz-question *{user-select:none;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none}
</style>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="sidebar-backdrop" id="sidebarBackdrop"></div>

<div class="app-shell">
  <div id="sidebarSlot"></div>

  <div class="main">
    <div id="topbarSlot"></div>

    <div class="content-inner">
      <p class="error-box" id="pageError"><i data-lucide="alert-circle"></i> <span id="pageErrorMsg"></span></p>

      <div class="wb-stepper">
        <button type="button" class="wb-step-nav active" data-wb-tab="pre">
          <span class="dot">P</span><span class="lbl">Pretest</span><span class="status">Memuat...</span>
        </button>
        <span class="wb-step-connector"></span>
        <button type="button" class="wb-step-nav locked" data-wb-tab="1">
          <span class="dot"><i data-lucide="lock"></i></span><span class="lbl">Webinar 1</span><span class="status">Terkunci</span>
        </button>
        <span class="wb-step-connector"></span>
        <button type="button" class="wb-step-nav locked" data-wb-tab="2">
          <span class="dot"><i data-lucide="lock"></i></span><span class="lbl">Webinar 2</span><span class="status">Terkunci</span>
        </button>
        <span class="wb-step-connector"></span>
        <button type="button" class="wb-step-nav locked" data-wb-tab="3">
          <span class="dot"><i data-lucide="lock"></i></span><span class="lbl">Webinar 3</span><span class="status">Terkunci</span>
        </button>
        <span class="wb-step-connector"></span>
        <button type="button" class="wb-step-nav locked" data-wb-tab="post">
          <span class="dot"><i data-lucide="lock"></i></span><span class="lbl">Posttest</span><span class="status">Terkunci</span>
        </button>
      </div>
      <div class="wb-cards">
        <div class="card active" data-webinar-panel="pre">
          <div class="empty-state">
            <div class="ic"><i data-lucide="hammer"></i></div>
            <div class="t">Memuat...</div>
          </div>
        </div>
        <div class="card" data-webinar-panel="1">
          <div class="empty-state">
            <div class="ic"><i data-lucide="hammer"></i></div>
            <div class="t">Memuat...</div>
          </div>
        </div>
        <div class="card" data-webinar-panel="2">
          <div class="empty-state">
            <div class="ic"><i data-lucide="hammer"></i></div>
            <div class="t">Memuat...</div>
          </div>
        </div>
        <div class="card" data-webinar-panel="3">
          <div class="empty-state">
            <div class="ic"><i data-lucide="hammer"></i></div>
            <div class="t">Memuat...</div>
          </div>
        </div>
        <div class="card" data-webinar-panel="post">
          <div class="lock-panel">
            <div class="ic"><i data-lucide="lock"></i></div>
            <div class="t">Posttest terkunci</div>
            <p>Posttest terbuka setelah kamu menyelesaikan Webinar 1, 2, dan 3.</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script src="auth.js"></script>
<script src="ui-sidebar.js"></script>
<script>
  // ---------- Data & state spesifik halaman Webinar ----------
  let webinarCache = null; // { webinars, best, soalCounts }
  let currentQuiz = null;  // { webinarId, nomor, soal, jawaban: {soalId: label} }

  // Status berbasis jam webinar (bukan cuma is_active):
  //  - belum_dibuka: admin belum aktifin menunya sama sekali
  //  - sudah_dibuka: aktif, tapi belum masuk jam mulai (atau jadwal gak diisi) — menu bisa diakses,
  //    link Zoom/rekaman udah kebuka, cuma sesi live-nya belum mulai
  //  - berlangsung: aktif dan sekarang ada di antara jadwal_mulai s/d jadwal_selesai
  function getWebinarWaktuStatus(w) {
    if (!w.is_active) return 'belum_dibuka';
    const now = new Date();
    const mulai = w.jadwal_mulai ? new Date(w.jadwal_mulai) : null;
    const selesai = w.jadwal_selesai ? new Date(w.jadwal_selesai) : null;
    if (mulai && now < mulai) return 'sudah_dibuka';
    if (mulai && selesai && now >= mulai && now <= selesai) return 'berlangsung';
    return 'sudah_dibuka';
  }

  async function loadWebinarsForPeserta(userId) {
    const [webinarsRes, attemptsRes, soalRes, tontonRes, settingsRes] = await Promise.all([
      supabaseClient.from('webinars').select('*').order('nomor'),
      supabaseClient.from('peserta_pretest').select('webinar_id, skor, total_soal').eq('peserta_id', userId),
      supabaseClient.from('webinar_soal').select('id, webinar_id'),
      supabaseClient.from('peserta_webinar_tonton').select('webinar_id, ditonton_at').eq('peserta_id', userId),
      supabaseClient.from('pretest_posttest_settings').select('pretest_active, posttest_active').limit(1).maybeSingle()
    ]);
    if (webinarsRes.error) { showPageError('Gagal memuat data webinar: ' + webinarsRes.error.message); return; }

    // Skor terbaik per webinar (peserta boleh coba berkali-kali, kita ambil yang paling tinggi).
    const bestByWebinar = {};
    (attemptsRes.data || []).forEach(a => {
      const cur = bestByWebinar[a.webinar_id];
      if (!cur || a.skor > cur.skor) bestByWebinar[a.webinar_id] = a;
    });

    const soalCounts = {};
    (soalRes.data || []).forEach(s => { soalCounts[s.webinar_id] = (soalCounts[s.webinar_id] || 0) + 1; });

    const tontonByWebinar = {};
    (tontonRes.data || []).forEach(t => { tontonByWebinar[t.webinar_id] = t; });

    const webinars = webinarsRes.data || [];
    webinars.forEach(w => renderWebinarNavBadge(w));

    const prePost = settingsRes.data || { pretest_active: true, posttest_active: true };

    webinarCache = { webinars, best: bestByWebinar, soalCounts, tonton: tontonByWebinar, prePost };
    updateWebinarStepper();
  }

  function renderWebinarNavBadge(w) {
    const badge = document.querySelector(`[data-webinar-nav-badge="${w.nomor}"]`);
    if (badge) badge.style.display = w.is_active ? 'none' : 'inline-flex';
  }

  function renderWebinarPanel(w, prereqDone, soalCount, tontonRow, pretestActive) {
    const container = document.querySelector(`[data-webinar-panel="${w.nomor}"]`);
    if (!container) return;

    if (!prereqDone) {
      const isPertama = w.nomor === 1;
      const pretestOff = isPertama && !pretestActive;
      container.innerHTML = `
        <div class="lock-panel">
          <div class="ic"><i data-lucide="${pretestOff ? 'hammer' : 'lock'}"></i></div>
          <div class="t">Webinar ${w.nomor} masih terkunci</div>
          <p>${pretestOff ? 'Sesi pretest belum dimulai. Webinar ' + w.nomor + ' akan terbuka setelah kamu menyelesaikan pretest.' : (isPertama ? 'Kerjakan Pretest terlebih dahulu' : 'Tandai "Sudah Menonton" pada Webinar ' + (w.nomor - 1) + ' terlebih dahulu') + ' untuk membuka Webinar ' + w.nomor + '.'}</p>
          ${pretestOff ? '' : `<button type="button" class="btn btn-primary btn-sm" id="btnGoToPrereqFromLock" style="margin-top:14px">${isPertama ? 'Kerjakan Pretest' : 'Buka Webinar ' + (w.nomor - 1)}</button>`}
        </div>
      `;
      lucide.createIcons();
      const goBtn = document.getElementById('btnGoToPrereqFromLock');
      if (goBtn) goBtn.addEventListener('click', () => showWebinarTab(isPertama ? 'pre' : String(w.nomor - 1)));
      return;
    }

    if (!w.is_active) {
      container.innerHTML = `
        <div class="empty-state">
          <div class="ic"><i data-lucide="hammer"></i></div>
          <div class="t">${escapeHtml(w.judul) || ('Webinar ' + w.nomor)} belum dibuka</div>
          <p>Menu ini akan aktif begitu jadwalnya tiba. Nantikan pembaruannya di sini.</p>
        </div>
      `;
      lucide.createIcons();
      return;
    }

    renderWebinarIdleState(w, tontonRow);
  }

  function renderWebinarIdleState(w, tontonRow) {
    const container = document.querySelector(`[data-webinar-panel="${w.nomor}"]`);
    const judul = w.judul ? escapeHtml(w.judul) : ('Webinar ' + w.nomor);
    const videoId = extractYoutubeId(w.youtube_url || '');
    const videoHtml = videoId
      ? `<div class="webinar-video"><iframe src="https://www.youtube.com/embed/${videoId}" title="${escapeAttr(w.judul || 'Webinar ' + w.nomor)}" allowfullscreen loading="lazy"></iframe></div>`
      : `<div class="empty-state" style="padding:24px 16px"><div class="ic"><i data-lucide="video-off"></i></div><p>Link video belum tersedia.</p></div>`;

    // Jadwal: pakai jadwal_mulai dari DB kalau ada, fallback ke WEBINAR_FALLBACK (tanggal doang, tanpa jam)
    // buat webinar yang belum diisi jadwalnya oleh admin.
    const tgl = w.jadwal_mulai ? fmtTglJam(w.jadwal_mulai) : (WEBINAR_FALLBACK[w.nomor] ? fmtTgl(WEBINAR_FALLBACK[w.nomor].tgl) : '');

    // Link Zoom cuma tampil kalau ada, dan (kalau jadwal_selesai diisi) belum lewat jamnya —
    // biar yang gak sempet nonton live tetep bisa akses rekaman YouTube-nya.
    const now = new Date();
    const lewatJadwal = !!(w.jadwal_selesai && now > new Date(w.jadwal_selesai));
    const tampilkanZoom = !!(w.zoom_url && !lewatJadwal);

    const tontonHtml = tontonRow
      ? `<div class="chip ok"><i data-lucide="check"></i> Sudah ditonton — ${fmtTglJam(tontonRow.ditonton_at)}</div>`
      : `<button type="button" class="btn btn-outline btn-sm btn-tonton" data-tandai-tonton="${w.id}"><i data-lucide="check-circle"></i> Saya Sudah Menonton</button>`;

    container.innerHTML = `
      <div class="section-title">
        <span class="ic ic-acc4"><i data-lucide="video"></i></span>
        <div>Webinar ${w.nomor}${w.judul ? ': ' + judul : ''}</div>
      </div>
      <div class="webinar-layout">
        <div>${videoHtml}</div>
        <div class="webinar-info-card">
          <div>
            <div class="webinar-info-title">${judul}</div>
            ${tgl ? `<div class="webinar-info-row"><i data-lucide="calendar"></i> ${tgl}</div>` : ''}
          </div>
          <p class="webinar-info-desc">Tonton videonya sampai selesai. Pre-test dan post-test dikerjakan di tab Pretest dan Posttest.</p>
          ${lewatJadwal ? `<p class="webinar-info-desc" style="color:#b8770a"><i data-lucide="info" style="width:13px;height:13px;vertical-align:-2px"></i> Sesi live sudah lewat — link Zoom tidak lagi tersedia, silakan tonton rekamannya di YouTube.</p>` : ''}
          <div class="webinar-cta">
            ${tampilkanZoom ? `<a class="btn btn-zoom btn-sm" href="${escapeAttr(w.zoom_url)}" target="_blank" rel="noopener"><i data-lucide="video"></i> Buka Zoom Webinar</a>` : tontonHtml}
          </div>
        </div>
      </div>
    `;
    lucide.createIcons();
  }

  document.addEventListener('click', async (e) => {
    const tontonBtn = e.target.closest('[data-tandai-tonton]');
    if (tontonBtn) { await tandaiSudahNonton(tontonBtn.dataset.tandaiTonton); return; }
    const startBtn = e.target.closest('[data-start-pretest]');
    if (startBtn) startPretest(startBtn.dataset.startPretest, startBtn.dataset.webinarNomor);
    const tab = e.target.closest('[data-wb-tab]');
    if (tab) showWebinarTab(tab.dataset.wbTab);
  });

  async function startPretest(webinarId, nomor) {
    const container = document.querySelector(`[data-webinar-panel="${nomor}"]`);
    container.innerHTML = `<div class="empty-state"><p>Memuat soal...</p></div>`;

    // Pretest & posttest sama-sama pakai bank soal Webinar 1 biar delta-nya bisa diukur (soal identik).
    // webinarId yang dilempar ke fungsi ini (w1.id buat pre, w3.id buat post) cuma dipakai sebagai kunci
    // pencatatan attempt di peserta_pretest.webinar_id, BUKAN sumber soalnya.
    const w1 = webinarCache && webinarCache.webinars.find(w => w.nomor === 1);
    const soalWebinarId = w1 ? w1.id : webinarId;
    const { data: soal, error } = await supabaseClient.from('webinar_soal').select('*').eq('webinar_id', soalWebinarId).order('urutan');
    if (error || !soal || soal.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          <div class="ic"><i data-lucide="alert-circle"></i></div>
          <div class="t">Soal belum tersedia</div>
          <p>Soal pretest/posttest belum disiapkan admin. Coba lagi nanti.</p>
        </div>
      `;
      lucide.createIcons();
      return;
    }

    currentQuiz = { webinarId, nomor, soal, jawaban: {} };
    renderQuizForm();
  }

  function renderQuizForm() {
    const { nomor, soal } = currentQuiz;
    const container = document.querySelector(`[data-webinar-panel="${nomor}"]`);
    const labelSoal = nomor === 'pre' ? 'Pretest' : 'Post-test';
    container.innerHTML = `
      <div class="section-title">
        <span class="ic ic-acc4"><i data-lucide="clipboard-list"></i></span>
        <div>${labelSoal} — ${soal.length} Soal</div>
      </div>
      ${soal.map((s, i) => `
        <div class="quiz-question">
          <div class="quiz-question-num">Soal ${i + 1} dari ${soal.length}</div>
          ${s.konteks ? `
            <div style="background:rgba(19,102,194,.06);border-left:4px solid var(--blue);border-radius:10px;padding:14px 16px 14px 14px;margin-bottom:12px">
              <div style="display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--blue);margin-bottom:6px"><i data-lucide="book-open" style="width:14px;height:14px"></i> Konteks / Skenario</div>
              <div style="font-size:13.5px;font-style:italic;color:var(--ink);line-height:1.6">${escapeHtml(s.konteks).replace(/\n/g, '<br>')}</div>
            </div>
          ` : ''}
          <div class="quiz-question-text">${escapeHtml(s.pertanyaan)}</div>
          ${(s.pilihan || []).map(p => `
            <label class="quiz-option" data-soal-id="${s.id}" data-pilihan-label="${p.label}">
              <input type="radio" name="quiz-${s.id}" value="${p.label}">
              <span class="opt-label">${p.label}.</span>
              <span class="opt-text">${escapeHtml(p.text)}</span>
            </label>
          `).join('')}
        </div>
      `).join('')}
      <p id="quizMsg-${nomor}" style="color:#b91c1c;font-weight:600;font-size:13px"></p>
      <div class="quiz-submit-card">
        <p>Pastikan semua soal sudah dijawab sebelum mengumpulkan — jawaban tidak bisa diubah lagi setelah dikumpulkan.</p>
        <button type="button" class="btn btn-primary" id="btnSubmitQuiz-${nomor}"><i data-lucide="send"></i> Kumpulkan Jawaban</button>
      </div>
    `;
    lucide.createIcons();

    // Cegah copy teks soal (klik kanan / Ctrl+C) — cuma di area .quiz-question, gak ganggu bagian lain
    container.querySelectorAll('.quiz-question').forEach(qEl => {
      qEl.addEventListener('copy', e => e.preventDefault());
      qEl.addEventListener('contextmenu', e => e.preventDefault());
      qEl.addEventListener('selectstart', e => e.preventDefault());
    });

    container.querySelectorAll('.quiz-option').forEach(opt => {
      opt.addEventListener('click', () => {
        const soalId = opt.dataset.soalId;
        const label = opt.dataset.pilihanLabel;
        currentQuiz.jawaban[soalId] = label;
        opt.querySelector('input').checked = true;
        container.querySelectorAll(`.quiz-option[data-soal-id="${soalId}"]`).forEach(o => o.classList.remove('selected'));
        opt.classList.add('selected');
      });
    });

    document.getElementById(`btnSubmitQuiz-${nomor}`).addEventListener('click', submitQuiz);
  }

  async function submitQuiz() {
    const { webinarId, nomor, soal, jawaban } = currentQuiz;
    const msg = document.getElementById(`quizMsg-${nomor}`);

    const unanswered = soal.filter(s => !jawaban[s.id]);
    if (unanswered.length > 0) {
      msg.textContent = `Masih ada ${unanswered.length} soal yang belum dijawab.`;
      return;
    }
    msg.textContent = '';

    const btn = document.getElementById(`btnSubmitQuiz-${nomor}`);
    btn.disabled = true;

    let skor = 0;
    const detailRows = soal.map(s => {
      const dipilih = jawaban[s.id];
      const benar = dipilih === s.jawaban_benar;
      if (benar) skor++;
      return { soal_id: s.id, pilihan_dipilih: dipilih, benar };
    });

    const { data: pretestRow, error: pretestError } = await supabaseClient.from('peserta_pretest')
      .insert({ webinar_id: webinarId, peserta_id: currentUserId, skor, total_soal: soal.length })
      .select().single();

    if (pretestError) {
      msg.textContent = 'Gagal menyimpan jawaban: ' + pretestError.message;
      btn.disabled = false;
      return;
    }

    const jawabanRows = detailRows.map(d => ({ ...d, pretest_id: pretestRow.id }));
    const { error: detailError } = await supabaseClient.from('peserta_pretest_jawaban').insert(jawabanRows);
    if (detailError) {
      msg.textContent = 'Gagal menyimpan detail jawaban: ' + detailError.message;
      btn.disabled = false;
      return;
    }

    // Skor disimpen ke DB (dipakai admin buat lihat hasilnya), tapi gak ditampilin ke peserta —
    // baik pretest maupun posttest cuma nampilin konfirmasi "sudah tersimpan", tanpa skor/review jawaban.
    onPostTestSaved(webinarId, skor, soal.length);
    renderQuizDone(nomor);
  }

  function renderQuizDone(nomor) {
    const isPre = nomor === 'pre';
    const container = document.querySelector(`[data-webinar-panel="${nomor}"]`);
    container.innerHTML = `
      <div class="lock-panel lock-panel-success">
        <div class="ic"><i data-lucide="check-circle"></i></div>
        <div class="t">${isPre ? 'Pretest selesai' : 'Posttest selesai'}</div>
        <p>${isPre ? 'Jawabanmu sudah tersimpan. Lanjutkan ke Webinar 1 untuk mulai mengikuti rangkaian webinar.' : 'Jawabanmu sudah tersimpan. Terima kasih sudah menyelesaikan seluruh rangkaian webinar.'}</p>
        ${isPre ? `<button type="button" class="btn btn-primary btn-sm" id="btnBackToIdle-${nomor}" style="margin-top:14px">Lanjut ke Webinar 1</button>` : ''}
      </div>`;
    lucide.createIcons();
    if (isPre) {
      document.getElementById(`btnBackToIdle-${nomor}`).addEventListener('click', async () => {
        await loadWebinarsForPeserta(currentUserId);
        showWebinarTab('1');
      });
    }
  }

  async function tandaiSudahNonton(webinarId) {
    const btn = document.querySelector(`[data-tandai-tonton="${webinarId}"]`);
    if (btn) btn.disabled = true;

    const { data, error } = await supabaseClient.from('peserta_webinar_tonton')
      .upsert({ webinar_id: webinarId, peserta_id: currentUserId }, { onConflict: 'webinar_id,peserta_id' })
      .select().single();

    if (error) {
      if (btn) btn.disabled = false;
      showPageError('Gagal menandai tontonan: ' + error.message);
      return;
    }

    if (webinarCache) webinarCache.tonton[webinarId] = data;
    updateWebinarStepper();
  }

  function onPostTestSaved(webinarId, skor, total) {
    if (!webinarCache) return;
    const cur = webinarCache.best[webinarId];
    if (!cur || skor > cur.skor) webinarCache.best[webinarId] = { webinar_id: webinarId, skor, total_soal: total };
    updateWebinarStepper();
  }

  function showWebinarTab(n) {
    document.querySelectorAll('[data-wb-tab]').forEach(b => b.classList.toggle('active', b.dataset.wbTab === String(n)));
    document.querySelectorAll('.wb-cards > [data-webinar-panel]').forEach(c => c.classList.toggle('active', c.dataset.webinarPanel === String(n)));
  }

  // Pretest global pakai soal Webinar 1, Posttest global pakai soal Webinar 3 — keduanya lewat
  // mekanisme kuis yang sama (startPretest/renderQuizForm/submitQuiz).
  function updateWebinarStepper() {
    if (!webinarCache) return;
    const w1 = webinarCache.webinars.find(w => w.nomor === 1);
    const w2 = webinarCache.webinars.find(w => w.nomor === 2);
    const w3 = webinarCache.webinars.find(w => w.nomor === 3);

    const pretestActive = webinarCache.prePost ? webinarCache.prePost.pretest_active !== false : true;
    const posttestActive = webinarCache.prePost ? webinarCache.prePost.posttest_active !== false : true;

    const preDone = !!(w1 && webinarCache.best[w1.id]);

    // Webinar 1: terkunci selama pretest belum dikerjakan. Webinar 2 & 3: terkunci kalau belum diaktifkan admin.
    // Nav tab DAN isi panelnya sama-sama di-refresh di sini — sebelumnya cuma tab nav yang keupdate,
    // jadinya abis pretest kelar tab-nya kebuka tapi konten panel Webinar 1 masih nyangkut di versi locked lama.
    const ditontonW1 = !!(w1 && webinarCache.tonton[w1.id]);
    const ditontonW2 = !!(w2 && webinarCache.tonton[w2.id]);
    const ditontonW3 = !!(w3 && webinarCache.tonton[w3.id]);
    // Prasyarat berjenjang: W1 nunggu pretest, W2 nunggu W1 dicentang "Sudah Menonton", W3 nunggu W2 —
    // jadi peserta yang gak sempet ikut live tetep harus jalanin webinar urut satu-satu.
    // Ini murni buat orang yang ketinggalan live & mau jalan sendiri belakangan — dan tetap kekunci
    // apa adanya kalau pretest-nya sendiri belum diaktifin admin (soal belum fix dsb).
    const prereqByNomor = { 1: preDone, 2: ditontonW1, 3: ditontonW2 };

    [w1, w2, w3].forEach(w => {
      if (!w) return;
      const prereqDone = prereqByNomor[w.nomor];
      // Kalau gak locked, label status ngikut jam webinar (belum_dibuka/sudah_dibuka/berlangsung),
      // bukan cuma is_active — jadi webinar yang aktif tapi belum masuk jam mulainya gak kebaca
      // "Sedang berlangsung".
      const waktuStatus = prereqDone ? getWebinarWaktuStatus(w) : null;
      const belumDibuka = prereqDone && waktuStatus === 'belum_dibuka';
      const ditonton = !!webinarCache.tonton[w.id];
      const btn = document.querySelector(`.wb-step-nav[data-wb-tab="${w.nomor}"]`);
      if (btn) {
        btn.classList.toggle('locked', !prereqDone || belumDibuka);
        btn.classList.toggle('done', prereqDone && !belumDibuka && ditonton);
        const dot = btn.querySelector('.dot');
        if (dot) dot.innerHTML = (!prereqDone || belumDibuka) ? '<i data-lucide="lock"></i>' : (ditonton ? '<i data-lucide="check"></i>' : String(w.nomor));
        const status = btn.querySelector('.status');
        if (status) {
          status.textContent = !prereqDone ? 'Terkunci'
            : (ditonton ? 'Selesai'
            : (belumDibuka ? 'Belum dibuka'
            : (waktuStatus === 'berlangsung' ? 'Sedang berlangsung' : 'Sudah dibuka')));
        }
      }
      renderWebinarPanel(w, prereqDone, webinarCache.soalCounts[w.id] || 0, webinarCache.tonton[w.id] || null, pretestActive);
    });

    const preBtn = document.querySelector('.wb-step-nav[data-wb-tab="pre"]');
    if (preBtn) {
      preBtn.classList.toggle('done', preDone);
      preBtn.classList.toggle('locked', !pretestActive && !preDone);
      const dot = preBtn.querySelector('.dot');
      if (dot) dot.innerHTML = preDone ? '<i data-lucide="check"></i>' : (!pretestActive ? '<i data-lucide="hammer"></i>' : 'P');
      const status = preBtn.querySelector('.status');
      if (status) status.textContent = preDone ? 'Selesai' : (!pretestActive ? 'Belum dibuka' : 'Belum dikerjakan');
    }

    const postSiap = ditontonW3 && posttestActive;
    const postDone = !!(w3 && webinarCache.best[w3.id]);
    const postBtn = document.querySelector('.wb-step-nav[data-wb-tab="post"]');
    if (postBtn) {
      postBtn.classList.toggle('locked', !postSiap);
      postBtn.classList.toggle('done', postDone);
      const dot = postBtn.querySelector('.dot');
      if (dot) dot.innerHTML = postDone ? '<i data-lucide="check"></i>' : (postSiap ? '<i data-lucide="file-check"></i>' : '<i data-lucide="lock"></i>');
      const status = postBtn.querySelector('.status');
      if (status) status.textContent = postDone ? 'Selesai' : (!posttestActive ? 'Belum dibuka' : (postSiap ? 'Belum dikerjakan' : 'Terkunci'));
    }

    lucide.createIcons();
    renderPretestPanel();
    renderPosttestPanel();
  }

  function renderPretestPanel() {
    const container = document.querySelector('[data-webinar-panel="pre"]');
    if (!container || !webinarCache) return;
    const w = webinarCache.webinars.find(x => x.nomor === 1);
    if (!w) return;
    const best = webinarCache.best[w.id] || null;
    const pretestActive = webinarCache.prePost ? webinarCache.prePost.pretest_active !== false : true;

    if (!pretestActive && !best) {
      container.innerHTML = `
        <div class="lock-panel">
          <div class="ic"><i data-lucide="hammer"></i></div>
          <div class="t">Pretest belum dibuka</div>
          <p>Sesi pretest belum dimulai. Nantikan informasi selanjutnya.</p>
        </div>`;
      lucide.createIcons();
      return;
    }

    container.innerHTML = `
      <div class="lock-panel${best ? ' lock-panel-success' : ''}">
        <div class="ic"><i data-lucide="${best ? 'check-circle' : 'file-check'}"></i></div>
        <div class="t">Pretest sebelum webinar</div>
        <p>${best ? 'Kamu sudah mengerjakan pretest. Pretest hanya bisa dikerjakan sekali.' : 'Kerjakan pretest ini sebelum mengikuti rangkaian Webinar 1–3.'}</p>
        ${best ? '' : `<button type="button" class="btn btn-primary btn-sm" data-start-pretest="${w.id}" data-webinar-nomor="pre" style="margin-top:14px">Kerjakan Pretest</button>`}
      </div>`;
    lucide.createIcons();
  }

  function renderPosttestPanel() {
    const container = document.querySelector('[data-webinar-panel="post"]');
    if (!container || !webinarCache) return;
    const w1 = webinarCache.webinars.find(x => x.nomor === 1);
    const w3 = webinarCache.webinars.find(x => x.nomor === 3);
    const ditontonW3 = !!(w3 && webinarCache.tonton[w3.id]);
    if (!ditontonW3 || !w3) {
      container.innerHTML = `
        <div class="lock-panel">
          <div class="ic"><i data-lucide="lock"></i></div>
          <div class="t">Posttest terkunci</div>
          <p>Selesaikan Webinar 1, 2, dan 3 (tandai "Sudah Menonton" di masing-masing) terlebih dahulu untuk membuka Posttest.</p>
        </div>`;
      lucide.createIcons();
      return;
    }

    const best = webinarCache.best[w3.id] || null;
    const posttestActive = webinarCache.prePost ? webinarCache.prePost.posttest_active !== false : true;

    if (!posttestActive && !best) {
      container.innerHTML = `
        <div class="lock-panel">
          <div class="ic"><i data-lucide="hammer"></i></div>
          <div class="t">Posttest belum dibuka</div>
          <p>Sesi posttest belum dimulai. Nantikan informasi selanjutnya.</p>
        </div>`;
      lucide.createIcons();
      return;
    }

    container.innerHTML = `
      <div class="lock-panel${best ? ' lock-panel-success' : ''}">
        <div class="ic"><i data-lucide="${best ? 'check-circle' : 'file-check'}"></i></div>
        <div class="t">Posttest</div>
        <p>${best ? 'Kamu sudah mengerjakan posttest. Posttest hanya bisa dikerjakan sekali.' : 'Kerjakan posttest untuk menyelesaikan rangkaian webinar.'}</p>
        ${best ? '' : `<button type="button" class="btn btn-primary btn-sm" data-start-pretest="${w3.id}" data-webinar-nomor="post" style="margin-top:14px">Kerjakan Posttest</button>`}
      </div>`;
    lucide.createIcons();
  }

  // ---------- Bootstrap halaman ----------
  (async function () {
    renderSidebarShell('webinar', 'Webinar');
    const boot = await bootstrapPeserta();
    if (!boot) return;
    if (boot.error) { showPageError(boot.error); return; }

    renderSidebar('webinar', 'Webinar');

    await loadWebinarsForPeserta(currentUserId);

    // Kalau datang dari link Beranda (mis. webinar.html#1 atau #pre), buka tab itu.
    const tabAwal = (location.hash || '').replace('#', '');
    if (tabAwal) showWebinarTab(tabAwal);
  })();
</script>
</body>
</html>
